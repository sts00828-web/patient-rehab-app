<body><main>
<header><a href="./">← アプリへ</a><h1>運動イラスト一覧</h1><p>同じ若い成人モデルで統一した9点です。画像をタップすると大きく開きます。</p></header>
<div class="grid">
<figure><a href="assets/exercises/pendulum.png?v=13"><img src="assets/exercises/pendulum.png?v=13" alt="机に片手をつき、反対の腕を下に垂らす若い男性"></a><figcaption>振り子体操<small>五十肩</small></figcaption></figure>
<figure><a href="assets/exercises/supine-flexion.png?v=13"><img src="assets/exercises/supine-flexion.png?v=13" alt="あお向けで組んだ両手を頭の方向に動かす同じ男性"></a><figcaption>あお向けで腕を上げる<small>五十肩</small></figcaption></figure>
