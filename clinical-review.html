<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v0.2 運動・画像レビュー</title>
<style>body{font-family:system-ui,sans-serif;font-size:18px;line-height:1.6;margin:20px auto;max-width:1000px;padding:0 16px;color:#18363a;background:#f6fafb}article{background:white;border:1px solid #abc;border-radius:12px;padding:20px;margin:20px 0;break-inside:avoid}img{width:100%;max-height:440px;object-fit:contain}select,button{font:inherit;min-height:48px;max-width:100%;padding:8px}p{overflow-wrap:anywhere}.notice{background:#fff0d3;padding:12px}figcaption{font-weight:bold}a{color:#136372}</style>
<script src="clinical-catalog.js"></script><script src="clinical-rules.js"></script></head><body>
<h1>運動・画像レビュー v0.2</h1><p class="notice">ローカルレビュー専用。全113運動は臨床承認前です。この一覧に処方・開始の機能はありません。ローカル動作確認済み（2026-09-25、依頼元レビュー側が実行）。実機確認・臨床承認は未実施です。</p>
<p><a href="index.html">アプリを開く（スタッフ画面の「疾患別メニューから選ぶ」へ）</a> ／ <a href="CLINICAL_V02_MAPPING.md">全113 IDの対応表</a></p>
<label for="category">カテゴリー</label><select id="category"><option value="all">全113運動</option></select>
<label for="level">段階</label><select id="level"><option value="beginner">初級</option><option value="intermediate">中級</option><option value="advanced">上級</option></select>
<p id="count" role="status"></p><main id="list"></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const category=document.getElementById('category'),level=document.getElementById('level');
for(const c of Object.values(ClinicalCatalog.categories)){const o=document.createElement('option');o.value=c.id;o.textContent=c.id+' '+c.name;category.appendChild(o);}
function render(){const ids=category.value==='all'?Object.keys(ClinicalCatalog.definitions):ClinicalCatalog.categories[category.value].levels[level.value];document.getElementById('count').textContent=ids.length+'候補。S06は画像採用保留、P02/P03/P10は個別条件待ち。';document.getElementById('list').innerHTML=ids.map(id=>{const d=ClinicalCatalog.definitions[id],path=ClinicalRules.imagePath({exerciseKey:d.key},true);return `<article><h2>${id} ${esc(d.name)}</h2><p>${esc(d.assetStatus)} ／ 臨床承認前</p>${path?`<figure><img loading="lazy" src="${esc(path)}" alt="${esc(d.name)}の姿勢" onerror="this.hidden=true;this.parentElement.querySelector('p').hidden=false"><p class="notice" hidden>画像を読み込めません。</p><figcaption>${esc(d.imageCaption)}</figcaption></figure>`:`<p class="notice">${esc(d.assetStatus)}：${esc(d.assetNotes)}</p>`}<p>${esc(d.steps.join(' '))}</p><p>目的：${esc(d.purpose)} ／ 用具：${esc(d.equipment)}</p><p>量の案（個別処方ではありません）：${esc(d.doseProposal)} ／ ${esc(ClinicalCatalog.presets[d.doseProposal[0]])}</p><p class="notice">${esc(d.caution)}</p><details><summary>姿勢・支持・負荷・最新画像確認結果</summary><p>${esc(d.pose)}</p><p>${esc(d.assetNotes)}</p><p>必要なゲート：${esc(d.gates)}</p><p>SHA-256：${esc(d.sha256||'画像なし')}</p></details></article>`}).join('');}
category.onchange=level.onchange=render;render();
</script></body></html>
